<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экскурсии по Санкт-Петербургу</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Каталог экскурсий</h1>
        <p>Выберите тур и забронируйте в 1 клик</p>
    </header>

    <!-- УДОБНАЯ СТРОКА ПОИСКА ЭКСКУРСИЙ -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Поиск экскурсии (например: Джаз, Мосты, Брат)..." oninput="handleSearch()">
    </div>

    <!-- БЛОК КНОПОК-ФИЛЬТРОВ -->
    <div class="filters-container">
        <button class="btn-filter" onclick="filterCatalog('bus')">Автобусные</button>
        <button class="btn-filter" onclick="filterCatalog('water')">Водные круизы</button>
        <button class="btn-filter" onclick="filterCatalog('kater')">Аренда катеров</button>
        <button class="btn-filter active" onclick="filterCatalog('all')">Все туры</button>
        <button class="btn-filter" onclick="filterCatalog('walk')">Пешеходные</button>
        <button class="btn-filter" onclick="filterCatalog('night')">Развод мостов</button>
    </div>

    <!-- Сетка с карточками -->
    <main id="catalog" class="catalog-grid"></main>

    <!-- Элемент для плавного всплывающего окна подробностей -->
    <div id="modal" class="modal-overlay">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- БЛОК КОНТАКТОВ И ССЫЛОК НА МЕССЕНДЖЕРЫ В ДВА РЯДА -->
    <div style="max-width: 500px; margin: 40px auto 10px auto; padding: 0 15px; text-align: center;">

            <a href="https://t.me/iva1n_f" target="_blank" class="btn-footer-contact">Telegram</a>
            <a href="https://wa.me" target="_blank" class="btn-footer-contact">WhatsApp</a>
            <a href="https://vk.me/club223133955" target="_blank" class="btn-footer-contact">ВКонтакте</a>
        </div>
    </div>
